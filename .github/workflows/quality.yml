name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python dependency manifests agree
        run: cmp backend/requirements.txt backend/app/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pip-audit==2.10.1

      - name: Audit backend dependencies
        run: python -m pip_audit -r backend/requirements.txt

      - name: Compile and test backend
        env:
          JWT_SECRET: ci-test-secret
          PUBLIC_DEMO_MODE: 'false'
        run: |
          python -m compileall -q backend/app
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Install browser verification dependencies
        working-directory: frontend
        run: |
          pip install uvicorn==0.54.0
          npx playwright install --with-deps chromium

      - name: Verify original demo in browser
        env:
          PUBLIC_DEMO_MODE: 'true'
          JWT_SECRET: ci-test-secret
          PYTHONPATH: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/hh-api.log 2>&1 &
          cd frontend
          npx playwright test

      - name: Save browser review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: original-demo-browser-review
          path: frontend/test-results
